spring:
  config:
    import: optional:file:.env.test[.properties]

  datasource:
    url: jdbc:postgresql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:5433}/${TEST_DB_NAME:novacart_test}
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${TEST_SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${TEST_SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${TEST_SPRING_JPA_HIBERNATE_FORMAT_SQL:false}

server:
  port: ${TEST_SERVER_PORT:8081}
